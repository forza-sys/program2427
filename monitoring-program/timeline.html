<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Event Diagram — HAZANA FOZ</title>
  <link rel="stylesheet" href="../dashboard-keuangan-app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-color, #f8fafc);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .timeline-page-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    .timeline-header-bar {
      padding: 16px 28px;
      background: var(--card-bg, #ffffff);
      border-bottom: 1.5px solid var(--border-color, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border-color, #cbd5e1);
      background: var(--card-bg, #ffffff);
      color: var(--text-color, #475569);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .status-tab-btn:hover {
      border-color: #10b981;
      color: #10b981;
    }
    .status-tab-btn.active {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    /* Main Diagram Workspace (16:9 Fit-to-Screen) */
    .timeline-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 36px;
      position: relative;
      overflow: hidden;
    }

    .timeline-canvas-card {
      background: var(--card-bg, #ffffff);
      border: 1.5px solid var(--border-color, #e2e8f0);
      border-radius: 20px;
      padding: 40px 32px 28px 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      box-sizing: border-box;
      position: relative;
    }

    /* Horizontal Axis Line Component */
    .axis-container {
      position: relative;
      margin: 140px 20px 120px 20px;
    }

    .axis-line {
      height: 6px;
      background: linear-gradient(90deg, #93c5fd 0%, #3b82f6 50%, #10b981 100%);
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .axis-node {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .axis-node:hover {
      transform: scale(1.3);
      border-color: #10b981;
    }

    .axis-label {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }

    /* Event Pins (Above Axis) */
    .event-pin {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 10;
    }
    .event-pin:hover {
      transform: translateX(-50%) translateY(-4px) scale(1.05);
      z-index: 20;
    }

    .pin-connector {
      width: 2px;
      background: #8b5cf6;
      margin-top: 4px;
    }

    .pin-badge {
      background: #ffffff;
      border: 1.5px solid #8b5cf6;
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.15);
      text-align: center;
      white-space: nowrap;
    }
    .pin-badge.terlaksana {
      border-color: #8b5cf6;
    }
    .pin-badge.akan {
      border-color: #3b82f6;
    }

    .pin-date {
      font-size: 0.68rem;
      font-weight: 700;
      color: #8b5cf6;
      text-transform: uppercase;
    }
    .pin-badge.akan .pin-date {
      color: #3b82f6;
    }

    .pin-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: #1e293b;
      margin-top: 2px;
    }

    .pin-shape {
      width: 10px;
      height: 10px;
      background: #8b5cf6;
      transform: rotate(45deg);
      margin-bottom: -5px;
    }
    .pin-badge.akan + .pin-shape {
      background: #3b82f6;
    }

    /* Range Bars (Below Axis) */
    .range-bar-item {
      position: absolute;
      top: 48px;
      height: 34px;
      border-radius: 17px;
      background: rgba(139, 92, 246, 0.12);
      border: 1.5px solid #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 5;
    }
    .range-bar-item:hover {
      background: rgba(139, 92, 246, 0.22);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }
    .range-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b5cf6;
    }

    .range-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0 8px;
    }

    /* Legend Box at Bottom */
    .timeline-legend {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
    }

    /* Tooltip Drawer Modal */
    .event-tooltip {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #ffffff;
      border: 1.5px solid #10b981;
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 280px;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content expanded" style="padding: 0; height: 100vh; overflow: hidden;">
    <div class="timeline-page-container">
      <!-- Top Bar -->
      <div class="timeline-header-bar">
        <div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <h1 style="font-size: 1.3rem; font-weight: 800; color: #0f172a; margin: 0;">Diagram Timeline & Roadmap Event FOZ</h1>
            <span style="font-size: 0.7rem; font-weight: 700; background: #8b5cf6; color: #fff; padding: 2px 8px; border-radius: 8px;">BENCHMARK DIAGRAM</span>
          </div>
          <p style="font-size: 0.8rem; color: #64748b; margin-top: 2px; margin-bottom: 0;">Visualisasi Alur & Jadwal Event Besar Forum Zakat 2024 - 2027</p>
        </div>

        <!-- Status Selector Tabs -->
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="status-tab-btn active" data-status="TERLAKSANA">Sudah Terlaksana</button>
          <button class="status-tab-btn" data-status="BELUM">Belum Terlaksana</button>
        </div>
      </div>

      <!-- Main Diagram Canvas Workspace -->
      <div class="timeline-workspace">
        <div class="timeline-canvas-card">
          <!-- Active Status Info -->
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <span style="font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px;">STATUS TERPILIH</span>
              <h2 id="active-status-display" style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 0;">Sudah Terlaksana</h2>
            </div>
            <div id="event-stats-badge" style="font-size: 0.8rem; font-weight: 600; color: #475569; background: #f1f5f9; padding: 6px 12px; border-radius: 8px;">
              Memuat data diagram...
            </div>
          </div>

          <!-- Dynamic Tooltip Details -->
          <div id="event-tooltip" class="event-tooltip">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px;">
              <span id="tooltip-date" style="font-size: 0.7rem; font-weight: 700; color: #8b5cf6;">-</span>
              <button onclick="document.getElementById('event-tooltip').style.display='none'" style="border: none; background: none; cursor: pointer; color: #94a3b8; font-size: 1rem;">&times;</button>
            </div>
            <h4 id="tooltip-title" style="font-size: 0.88rem; font-weight: 800; color: #0f172a; margin: 0 0 6px 0;">-</h4>
            <div id="tooltip-status" style="font-size: 0.7rem; font-weight: 700; display: inline-block; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px;">-</div>
            <div id="tooltip-desc" style="font-size: 0.75rem; color: #64748b;">-</div>
          </div>

          <!-- Horizontal Timeline Diagram Component -->
          <div id="axis-wrapper" class="axis-container">
            <div class="axis-line" id="axis-nodes-container">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Legend Footer -->
          <div class="timeline-legend">
            <div style="font-size: 0.8rem; font-weight: 700; color: #0f172a;">Legend:</div>
            <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
              <div class="legend-item">
                <span style="width: 12px; height: 12px; background: #8b5cf6; transform: rotate(45deg); display: inline-block;"></span>
                <span>Sudah Terlaksana (Single Event)</span>
              </div>
              <div class="legend-item">
                <span style="width: 12px; height: 12px; background: #3b82f6; transform: rotate(45deg); display: inline-block;"></span>
                <span>Akan Dilaksanakan (Single Event)</span>
              </div>
              <div class="legend-item">
                <span style="width: 24px; height: 8px; background: rgba(59, 130, 246, 0.2); border: 1.5px solid #3b82f6; border-radius: 4px; display: inline-block;"></span>
                <span>Program Rentang Waktu (Multi-Bulan)</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../sidebar.js"></script>
  <script src="./timeline.js"></script>
</body>
</html>
